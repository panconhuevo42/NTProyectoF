<!-- catalog.html - VERSIÓN SUPER SIMPLE -->
<div style="background: red; color: white; padding: 50px; text-align: center;">
  <h1 style="font-size: 32px;">🎮 GAMERESERVE CATALOG 🎮</h1>
  <p style="font-size: 24px;">¡El componente está funcionando!</p>
  <p>Loading: {{loading}}</p>
  <p>Error: {{error}}</p>
</div>

<div *ngIf="loading" style="background: blue; color: white; padding: 20px;">
  CARGANDO JUEGOS...
</div>

<div *ngIf="error" style="background: orange; color: black; padding: 20px;">
  ERROR: {{error}}
</div>
