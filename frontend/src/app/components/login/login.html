<!-- frontend/src/app/components/login/login.html -->
<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">
      {{ isLoginMode ? 'Iniciar Sesión' : 'Registrarse' }}
    </h2>

    <form (ngSubmit)="onSubmit()" #authForm="ngForm" class="auth-form">
      
      
      <div class="form-group" *ngIf="!isLoginMode">
        <input 
          [(ngModel)]="userData.username" 
          name="username" 
          placeholder="Nombre de usuario" 
          type="text"
          required 
          minlength="3"
          class="form-control"
        />
      </div>
      
      <div class="form-group">
        <input 
          [(ngModel)]="userData.email" 
          name="email" 
          placeholder="Email" 
          type="email"
          required 
          class="form-control"
        />
      </div>
      
      <div class="form-group">
        <input 
          [(ngModel)]="userData.password" 
          name="password" 
          placeholder="Contraseña" 
          type="password" 
          required
          minlength="6"
          class="form-control"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="loading || !authForm.valid"
        class="auth-btn"
      >
        {{ loading ? 'Cargando...' : (isLoginMode ? 'Iniciar Sesión' : 'Registrarse') }}
      </button>
    </form>

    <div *ngIf="message" class="auth-error">
      {{ message }}
    </div>

    <div class="auth-switch">
      <span>
        {{ isLoginMode ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
        <a (click)="switchMode()" class="auth-link">
          {{ isLoginMode ? 'Regístrate' : 'Inicia sesión' }}
        </a>
      </span>
    </div>
  </div>
</div>
