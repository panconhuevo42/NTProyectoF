<!-- frontend/src/app/app.html -->
 
<nav class="navbar">
  <div class="nav-brand">
    <h1>🎮 GameReserve</h1>
  </div>
  
  <div class="nav-links">
    <a routerLink="/catalog" routerLinkActive="active">Catálogo</a>
    <a routerLink="/reservations" routerLinkActive="active">Mis Reservas</a>
    <a routerLink="/wallet" routerLinkActive="active">Wallet</a>
    
    <!-- Mostrar Login/Logout según estado -->
    <ng-container *ngIf="!isLoggedIn; else loggedIn">
      <a routerLink="/login" routerLinkActive="active">Iniciar Sesión</a>
    </ng-container>
    
    <ng-template #loggedIn>
      <button (click)="logout()" class="logout-btn">Cerrar Sesión</button>
      <span class="user-info">
        <span class="user-welcome">Hola, {{ userName }}</span>
        <span class="user-balance">${{ userBalance }}</span>
      </span>
    </ng-template>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
